<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Engineering Tools</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1c33">
  <meta name="description" content="Client-side electrical design calculators for LV cables, power networks and lightning risk.">
  <link rel="icon" type="image/png" sizes="64x64" href="logo-64.png">
  <link rel="apple-touch-icon" sizes="192x192" href="logo-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@430;550;650;750&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    // Apply the stored / system theme before Angular boots to avoid a flash.
    (function () {
      try {
        var m = localStorage.getItem('et.theme.mode');
        var dark = m === 'dark' || (!m && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('app-dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>JavaScript is required to run Engineering Tools.</noscript>
</body>
</html>
